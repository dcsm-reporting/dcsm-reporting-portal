name = "dcsm-ki-portal"
main = "src/server/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# Single-service deploy: the Worker serves /api/* and falls back to the built
# SPA in dist/client for everything else.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "dcsm_ki"
database_id = "aee239d8-061b-461b-8920-0b9b71bd0057"
migrations_dir = "migrations"

# Bundle the Area To Ward Key CSV as text so /api/seed can run server-side.
[[rules]]
type = "Text"
globs = ["**/*.csv"]
fallthrough = true

# NOTE: no DEV_USER here on purpose. In production the auth middleware requires
# the Cf-Access-Authenticated-User-Email header that Cloudflare Access injects —
# with no DEV_USER fallback, the API fails closed (401) until Access is set up.
# For local `wrangler dev`, put `DEV_USER = "you@example.com"` in `.dev.vars`
# (gitignored) so the local server lets you in.
[vars]
PORTAL_ENV = "production"
